<title>هیئت معظم حسینیون</title>

<style>

*{
  box-sizing:border-box;
}

:root{
  --bg:#080808;
  --card:#111;
  --line:#252525;
  --text:#f4f4f4;
  --muted:#a8a8a8;
  --red:#9d1717;
  --red2:#d12a2a;
}

body{
  margin:0;
  background:
    radial-gradient(circle at top,#180707 0,#080808 34%,#050505 100%);
  color:var(--text);
  font-family:Tahoma,Arial,sans-serif;
}

a{
  text-decoration:none;
  color:inherit;
}

.page{
  width:min(100%,620px);
  margin:auto;
  padding:22px 16px 34px;
}

/* ================= HEADER ================= */

header{
  text-align:center;
  padding:12px 4px 22px;
}

.logo{
  width:68px;
  height:68px;
  border:1px solid #3b1515;
  border-radius:50%;
  display:grid;
  place-items:center;
  margin:0 auto 12px;
  background:#0d0d0d;
  box-shadow:0 0 35px #5b0b0b44;
  overflow:hidden;
}

.logo img{
  width:100%;
  height:100%;
  object-fit:contain;
  border-radius:50%;
  display:block;
}

h1{
  font-size:22px;
  margin:0 0 6px;
}

.sub{
  font-size:12px;
  color:var(--muted);
}

/* ================= TITLES ================= */

.section-title{
  display:flex;
  align-items:center;
  gap:9px;
  margin:20px 2px 11px;
  font-size:14px;
  font-weight:bold;
}

.section-title:before{
  content:"";
  width:3px;
  height:17px;
  background:var(--red2);
  border-radius:5px;
}

/* ================= REPORT ================= */

.report-card{
  width:100%;
  height:215px;
  border:1px solid var(--line);
  border-radius:18px;
  overflow:hidden;
  position:relative;
  background:#0b0b0b;
}

.report-gallery{
  width:100%;
  height:100%;
  display:flex;
  overflow-x:auto;
  overflow-y:hidden;
  scroll-snap-type:x mandatory;
  scroll-behavior:smooth;
  scrollbar-width:none;
}

.report-gallery::-webkit-scrollbar{
  display:none;
}

.report-slide{
  min-width:100%;
  width:100%;
  height:100%;
  position:relative;
  scroll-snap-align:start;
  flex-shrink:0;
  overflow:hidden;
}

.report-slide img{
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
  object-position:center;
  transition:
    transform .55s ease,
    filter .55s ease;
}

/* حرکت خیلی ظریف عکس هنگام فعال شدن */

.report-slide.is-active img{
  transform:scale(1.015);
  filter:brightness(1);
}

/* ================= DOTS ================= */

.slide-dots{
  position:absolute;
  left:50%;
  bottom:13px;
  transform:translateX(-50%);

  display:flex;
  align-items:center;
  justify-content:center;

  gap:6px;

  padding:6px 9px;

  background:rgba(0,0,0,.52);
  backdrop-filter:blur(9px);
  -webkit-backdrop-filter:blur(9px);

  border:1px solid rgba(255,255,255,.08);

  border-radius:20px;

  direction:ltr;

  z-index:10;
}

.report-dot{
  width:6px;
  height:6px;

  padding:0;
  border:0;

  border-radius:50%;

  background:#aaa;

  opacity:.55;

  cursor:pointer;

  transition:
    width .35s ease,
    background .35s ease,
    opacity .35s ease,
    box-shadow .35s ease;
}

.report-dot.active{
  width:22px;
  height:6px;

  border-radius:20px;

  background:var(--red2);

  opacity:1;

  box-shadow:
    0 0 10px rgba(209,42,42,.45);
}

/* ================= REPORT INFO ================= */

.report-info{
  position:absolute;
  right:0;
  left:0;
  bottom:0;

  padding:
    55px
    15px
    14px;

  background:
    linear-gradient(
      transparent,
      rgba(5,5,5,.92)
    );

  pointer-events:none;

  z-index:5;
}

.report-info b{
  display:block;
  font-size:14px;
  margin-bottom:5px;
}

.report-info small{
  color:#bbb;
  font-size:11px;
}

/* ================= SOCIAL ================= */

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.social{
  display:flex;
  align-items:center;
  gap:11px;

  padding:13px;

  border:1px solid var(--line);
  border-radius:15px;

  background:#0e0e0e;

  transition:.2s;
}

.social:active{
  transform:scale(.98);
}

.icon{
  width:38px;
  height:38px;

  flex-shrink:0;

  border-radius:11px;

  display:grid;
  place-items:center;

  background:#181818;

  font-size:17px;
}

.social span{
  font-size:12px;
}

.social small{
  display:block;
  color:var(--muted);
  font-size:10px;
  margin-top:3px;
}

/* ================= CARD ================= */

.card{
  border:1px solid var(--line);
  background:#0e0e0e;
  border-radius:17px;
  padding:15px;
}

/* ================= PHONE ================= */

.phone{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.phone .number{
  font-size:18px;
  direction:ltr;
}

.action{
  display:block;

  text-align:center;

  border:1px solid #421313;
  background:#210909;

  padding:11px;

  border-radius:12px;

  font-size:12px;

  margin-top:12px;
}

.action:active{
  transform:scale(.98);
}

/* ================= ADDRESS ================= */

.address{
  line-height:2;
  font-size:13px;
  color:#ddd;
}

.map-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
  margin-top:12px;
}

.map-buttons a{
  padding:12px;
  text-align:center;

  border-radius:12px;

  background:#171717;

  border:1px solid var(--line);

  font-size:11px;
}

/* ================= FOOTER ================= */

footer{
  text-align:center;
  color:#666;
  font-size:10px;
  padding-top:28px;
}

/* ================= MOBILE ================= */

@media(max-width:380px){

  .grid{
    grid-template-columns:1fr;
  }

  .report-card{
    height:215px;
  }

}

</style>
</head>
